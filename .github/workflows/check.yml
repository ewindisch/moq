name: Check

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the job itself is skipped on close.
    types: [opened, synchronize, reopened, closed]

# Cancel in-flight runs when a new commit lands on the same PR, or when the PR
# is merged/closed (the close event shares this group and supersedes the build).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Skip the actual work on close/merge: this run exists only to cancel the
    # superseded in-flight build via the concurrency group above.
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    # Backstop a hang (e.g. a wedged test) instead of holding the runner for the
    # 6-hour default. Generous enough for a cold first build.
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history so `just changed` can diff against origin/$GITHUB_BASE_REF.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
      - uses: DeterminateSystems/flake-checker-action@a0f068d37b542f3150564fbf1164fec2d958ee11 # main

      # Cache Rust dependencies and build artifacts via the Actions cache.
      - name: Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      # `just ci` calls `just changed` internally to skip unchanged scopes.
      - run: nix develop --command just ci

  swift:
    name: Swift
    if: github.event.action != 'closed'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Swift changes
        id: swift-changes
        run: |
          base="origin/${GITHUB_BASE_REF}"
          merge_base=$(git merge-base "$base" HEAD) || {
            echo "error: cannot resolve merge-base against $base (is full history fetched?)" >&2
            exit 1
          }
          files=$(git diff --name-only "$merge_base")

          if [[ -n "$files" ]] && echo "$files" | grep -qE '^(swift/|rs/moq-ffi/|\.github/workflows/check\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "swift: no Swift or moq-ffi changes; skipping."
          fi

      - name: Install Rust
        if: steps.swift-changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust Cache
        if: steps.swift-changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Swift check
        if: steps.swift-changes.outputs.run == 'true'
        run: ./swift/scripts/check.sh
